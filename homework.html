<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Super Heroes</title>
    <style>
        body { 
            font-family: Arial, Helvetica, sans-serif;
            background : #f0f4ff;
            padding : 30px;
            text-align : center;
        }

        h1 { color : #ff5a43;}

        p { color : #555;}

        .cards { 
            display : flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            border: 3px solid #ff5a43;
            border-radius: 14px;
            padding : 20px;
            width: 200px;
        }

        .hero-name {
            font-size: 22px;
            font-weight: bold;
            color : #333;
        }

        .hero-fact { 
            color : #df6767; 
            margin-top: 10px;
            font-size: 14px;
        }

        button { 
            background: #ff5a43;
            color: white;
            border: none;
            padding : 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>My SuperHeroes</h1>
    <p>Use a Javascript class to build superhero cards!</p>
    <button onclick = "ShowSuperHeros()">Show SuperHeroes!</button>
    <div class = "cards">
        <div id = "class1"></div>
        <div id = "class2"></div>
        <div id = "class3"></div>
    </div>
    <script>
        class Hero {
            constructor(name,fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }

        function ShowSuperHeros() {
            let p1 = new Hero ("Tanjiro", "Tanjiro is a rare hero who can use sun breathing!");
            let p2 = new Hero ("Light Yagami", "Light Yagami has the deathnote book!");
            let p3 = new Hero ("Avatar aang", "Avatar Aang can master all 4 elements and bring peace and order to the world!");
        

        document.getElementById("class1").innerHTML = "<div class = 'card'><div class = 'hero-name'>" + p1.name + "</div>" + "<div class = 'hero-fact'>" + p1.describe() + "</div></div>";

        document.getElementById("class2").innerHTML = "<div class = 'card'><div class = 'hero-name'>" + p2.name + "</div>" + "<div class = 'hero-fact'>" + p2.describe() + "</div></div>";

        document.getElementById("class3").innerHTML = "<div class = 'card'><div class = 'hero-name'>" + p3.name + "</div>" + "<div class = 'hero-fact'>" + p3.describe() + "</div></div>";
        }
    </script>
</body>
</html>
